app = "virus-game-bot"
primary_region = "fra"

[build]

[env]
  USE_WEBHOOK = "true"
  DATABASE_URL = "sqlite+aiosqlite:////data/app.db"
  BOT_USERNAME = "virus_play_bot"

[[mounts]]
  source = "virus_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
