<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VIRUS GAME BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="back-btn" id="back-btn" aria-label="back">‹</button>
      <h1 class="title">VIRUS GAME BOT</h1>
      <div class="top-actions">
        <button class="icon-btn" id="menu-btn" aria-label="menu">⋮</button>
        <button class="icon-btn" id="close-btn" aria-label="close">×</button>
      </div>
    </header>

    <div class="header-row">
      <button class="pill referral-pill" id="referral-pill">
        <span class="ref-icon">🔗</span><span>REFERRAL</span>
      </button>
      <div class="level-badge">
        <span class="star">⭐</span><span class="level-num" id="level-num">1</span>
      </div>
    </div>

    <div class="inventory-shortcut" id="inventory-shortcut">
      <div class="chest">🎁</div>
      <span class="lbl">ИНВЕНТАРЬ</span>
    </div>

    <main id="screen-root"></main>

    <nav class="bottom-nav">
      <button class="nav-item" data-screen="home">
        <span class="nav-ic">⏳</span><span>Главная</span>
      </button>
      <button class="nav-item" data-screen="tasks">
        <span class="nav-ic">⚙</span><span>Задания</span>
      </button>
      <button class="nav-item active" data-screen="roulette">
        <span class="nav-ic">✺</span><span>Рулетка</span>
      </button>
      <button class="nav-item" data-screen="shop">
        <span class="nav-ic">🛍</span><span>Магазин</span>
      </button>
      <button class="nav-item" data-screen="history">
        <span class="nav-ic">📜</span><span>История</span>
      </button>
    </nav>

    <footer class="footer">@<span id="bot-username">virus_play_bot</span></footer>

    <div class="modal hidden" id="modal">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card">
        <button class="modal-close" data-close="1">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <div class="toast-host" id="toast-host"></div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
